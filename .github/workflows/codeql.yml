name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC, independent of any code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # java-kotlin here only builds bindings/java (plain javac) -- it does
        # not cover android/, since that needs a full Android SDK + Gradle
        # setup in CI. Add an `android/` build step here if that gets set up.
        include:
          - language: cpp
            os: ubuntu-latest
            build-mode: manual
          - language: csharp
            os: ubuntu-latest
            build-mode: manual
          - language: java-kotlin
            os: ubuntu-latest
            build-mode: manual
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          - language: swift
            os: macos-latest
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # --- Manual build steps, one per compiled language ---

      - name: Build C++ core
        if: matrix.language == 'cpp'
        run: make -C core lib

      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build .NET bindings
        if: matrix.language == 'csharp'
        run: dotnet build bindings/dotnet/AegisScan.Interop/AegisScan.Interop.csproj

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build Java bindings
        if: matrix.language == 'java-kotlin'
        run: |
          mkdir -p out
          javac --release 21 --enable-preview -d out \
            $(find bindings/java/src/main/java -name '*.java')

      - name: Build Swift package
        if: matrix.language == 'swift'
        run: swift build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
